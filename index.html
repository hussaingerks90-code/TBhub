<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TBhub Telegram Login</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #1f2937;
      background: #f8fafc;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 360px);
      padding: 28px 24px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #ffffff;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    p {
      margin: 0 0 20px;
      color: #64748b;
      line-height: 1.5;
    }

    #fallback {
      margin: 20px 0 0;
      color: #b45309;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Link your Telegram account</h1>
    <p>Continue with Telegram to connect your account to TBhub.</p>

    <script
      async
      src="https://telegram.org/js/telegram-widget.js?22"
      data-telegram-login="TBhubLoginBot"
      data-size="large"
      data-userpic="false"
      data-request-access="write"
      data-onauth="onTelegramAuth(user)">
    </script>

    <p id="fallback" hidden>Please open this page through the TBhub app</p>
  </main>

  <script>
    const fallback = document.getElementById('fallback');

    if (!window.TelegramAuth || typeof window.TelegramAuth.postMessage !== 'function') {
      fallback.hidden = false;
    }

    function onTelegramAuth(user) {
      const payload = {
        id: user.id,
        first_name: user.first_name,
        username: user.username,
        photo_url: user.photo_url,
        auth_date: user.auth_date,
        hash: user.hash
      };

      if (window.TelegramAuth && typeof window.TelegramAuth.postMessage === 'function') {
        window.TelegramAuth.postMessage(JSON.stringify(payload));
        return;
      }

      fallback.hidden = false;
    }
  </script>
</body>
</html>
